name: x86_64 and i686 ucrt sjlj release builds

on:
  workflow_dispatch:
    inputs:                 # 定义输入参数
      gcc-version:          # 参数ID
        description: 'gcc版本'
        required: true
        type: string        # 参数类型：字符串
      rt-version:
        description: 'mingw-w64版本'
        required: true
        type: string        # 参数类型：字符串
      mingw-rev:
        description: '发布版本'
        required: true
        type: string       # 参数类型：字符串
        default: '0'

jobs:
  download:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6
      with:
        repository: 'cqlipeizhi/mingw-builds'
        ref: 'dev-lpz-ucrt-sjlj'

    - uses: msys2/setup-msys2@v2
      with:
        update: true

    - name: Download sources
      shell: msys2 {0}
      run: >-
        ./build
        --mode=gcc-${{ inputs.gcc-version }}
        --buildroot=/c/buildroot
        --jobs=4
        --rev=${{ inputs.mingw-rev }}
        --with-default-msvcrt=ucrt
        --rt-version=${{ inputs.rt-version }}
        --threads=posix
        --exceptions=seh
        --arch=x86_64
        --bin-compress
        --enable-languages=c,c++,fortran
        --logviewer-command=cat
        --fetch-only

    - name: Compress sources
      run: 7z a src.7z src "-xr!.git"
      working-directory: c:/buildroot

    - name: Upload sources
      uses: actions/upload-artifact@v7
      with:
        path: c:/buildroot/src.7z
        compression-level: 0
        archive: false

  build:
    needs: [download]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
        threads: [posix, win32]
        exceptions: [sjlj]
        msvcrt: [ucrt]

    steps:
    - uses: actions/checkout@v6
      with:
        repository: 'cqlipeizhi/mingw-builds'
        ref: 'dev-lpz-ucrt-sjlj'

    - uses: msys2/setup-msys2@v2
      with:
        update: true

    - name: Download sources
      uses: actions/download-artifact@v8
      with:
        name: src.7z
        path: c:/buildroot

    - name: Extract sources
      run: 7z x src.7z
      working-directory: c:/buildroot

    - name: Build
      shell: msys2 {0}
      run: >-
        ./build
        --mode=gcc-${{ inputs.gcc-version }}
        --buildroot=/c/buildroot
        --jobs=4
        --rev=${{ inputs.mingw-rev }}
        --with-default-msvcrt=${{ matrix.msvcrt }}
        --rt-version=${{ inputs.rt-version }}
        --threads=${{ matrix.threads }}
        --exceptions=${{ matrix.exceptions }}
        --arch=${{ matrix.arch }}
        --bin-compress
        --enable-languages=c,c++,fortran
        --logviewer-command=cat
        --no-bootstrap
        --bootstrapall

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: bin-${{ matrix.arch }}-${{ matrix.threads }}-${{ matrix.exceptions }}-${{ matrix.msvcrt }}
        path: c:/buildroot/archives/

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        pattern: "bin-*"
        path: ./
        merge-multiple: true

    - name: Upload to Release
      id: upload_to_release
      uses: softprops/action-gh-release@v1
      with:
        files: "*.7z"
